media:
  - name: documentos
    label: Documentos PDF
    input: docs
    output: /docs
    extensions: [pdf]
    rename: safe

settings:
  hide: true
  content:
    merge: true
  commit:
    identity: app
    templates:
      create: "transparencia(create): {path}"
      update: "transparencia(update): {path}"
      delete: "transparencia(delete): {path}"
      rename: "transparencia(rename): {oldPath} -> {newPath}"

content:
  - name: transparencia
    label: Transparência
    type: file
    path: data/transparencia.json
    format: json
    operations:
      create: false
      rename: false
      delete: false
    fields:
      - name: secoes
        label: Seções de documentos
        type: object
        required: true
        list:
          min: 1
          collapsible:
            collapsed: true
            summary: "{titulo}"
        fields:
          - name: id
            label: Identificador
            type: uuid
            required: true
            options:
              editable: false
              generate: false
          - name: titulo
            label: Título da seção
            type: string
            required: true
            description: "Exemplo: Demonstrações financeiras 2026"
            options:
              maxlength: 140
          - name: destaque
            label: Palavra em destaque
            type: string
            required: false
            description: "Opcional. Copie exatamente uma palavra ou trecho do título para exibi-lo em rosa."
            options:
              maxlength: 60
          - name: descricao
            label: Contexto da seção
            type: text
            required: false
            description: "Opcional. Use texto simples, sem HTML e sem dados pessoais."
            options:
              maxlength: 1200
          - name: ordem
            label: Ordem da seção
            type: number
            required: true
            default: 10
            description: "Use 10, 20, 30... Menores aparecem primeiro."
            options:
              min: 0
          - name: publicada
            label: Exibir seção no site
            type: boolean
            required: true
            default: true
          - name: documentos
            label: Documentos
            type: object
            required: true
            list:
              collapsible:
                collapsed: true
                summary: "{titulo}"
            fields:
              - name: id
                label: Identificador
                type: uuid
                required: true
                options:
                  editable: false
                  generate: false
              - name: titulo
                label: Título do documento
                type: string
                required: true
                options:
                  maxlength: 180
              - name: descricao
                label: Descrição
                type: text
                required: true
                description: "Explique em uma ou duas frases o que o visitante encontrará. Não use HTML."
                options:
                  maxlength: 800
              - name: selo
                label: Selo curto
                type: string
                required: false
                description: "Exemplo: 2026, ECD ou Regulamento"
                options:
                  maxlength: 80
              - name: arquivo
                label: Arquivo PDF
                type: file
                required: true
                options:
                  media: documentos
                  extensions: [pdf]
                  rename: safe
              - name: ordem
                label: Ordem do documento
                type: number
                required: true
                default: 10
                description: "Use 10, 20, 30... Menores aparecem primeiro."
                options:
                  min: 0
              - name: publicado
                label: Exibir documento no site
                type: boolean
                required: true
                default: true
